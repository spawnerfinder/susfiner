name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unpack project
        run: |
          echo "" | base64 -d > project.zip
          unzip -q project.zip -x ".github/*"
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: susfinder-jar
          path: build/libs/*.jar
          
